apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: room-booking-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: room-booking-l29b-room-booking-api
      name: http
      visibility: project
      envBindings:
        address: ROOM_BOOKING_API_URL
  resources:
    - ref: room-booking-l29b-5a4f26d3
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
